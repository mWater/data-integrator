<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mWater Data Integrator</title>
    <script>
      // Stamp the resolved color mode before first paint to avoid a theme flash.
      // ThemeProvider takes over ownership of the attribute once React mounts.
      try {
        var t = localStorage.getItem("di-theme")
        if (t !== "light" && t !== "dark")
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
